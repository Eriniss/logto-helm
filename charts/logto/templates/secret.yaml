{{- if .Values.postgresql.enabled }}
{{- /* With postgresql.auth.existingSecret, DB_URL is assembled from that secret in the pod env */}}
{{- if not .Values.postgresql.auth.existingSecret }}
{{- $name := printf "%s-db" (include "logto.fullname" .) }}
{{- $password := .Values.postgresql.auth.password }}
{{- if not $password }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (hasKey $existing.data "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- end }}
{{- $auth := .Values.postgresql.auth }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "logto.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $password | quote }}
  uri: {{ printf "postgresql://%s:%s@%s:5432/%s" (urlquery $auth.username) (urlquery $password) (include "logto.postgresql.fullname" .) $auth.database | quote }}
{{- end }}
{{- else if .Values.externalDatabase.existingSecret }}
{{- /* DB_URL comes from the user's secret */}}
{{- else if .Values.externalDatabase.url }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "logto.fullname" . }}-db
  labels:
    {{- include "logto.labels" . | nindent 4 }}
type: Opaque
stringData:
  uri: {{ .Values.externalDatabase.url | quote }}
{{- else }}
{{- fail "postgresql.enabled=false requires externalDatabase.url or externalDatabase.existingSecret" }}
{{- end }}
